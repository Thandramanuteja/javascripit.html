<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Colors</title>

  <style>
    .color-row {
      display: flex;
      align-items: center;
      margin-top: 10px;
      font-size: 18px;
    }

    .color-box {
      width: 60px;
      height: 30px;
      margin-right: 10px;
    }

    .red { background-color: red; }
    .blue { background-color: blue; }
    .green { background-color: green; }
    .yellow { background-color: yellow; }
    .pink { background-color: pink; }
    .orange { background-color: orange; }
  </style>
</head>

<body>

  <div class="color-row">
    <div class="color-box red"></div>
    <span>Red</span>
  </div>

  <div class="color-row">
    <div class="color-box blue"></div>
    <span>Blue</span>
  </div>

  <div class="color-row">
    <div class="color-box green"></div>
    <span>Green</span>
  </div>

  <div class="color-row">
    <div class="color-box yellow"></div>
    <span>Yellow</span>
  </div>

  <div class="color-row">
    <div class="color-box pink"></div>
    <span>Pink</span>
  </div>

  <div class="color-row">
    <div class="color-box orange"></div>
    <span>Orange</span> <button>click</button>
  </div>

</body>
</html>
