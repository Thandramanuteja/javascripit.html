<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Registration</title>
    <link rel="stylesheet" type="text/css" href="./regisform2.css">
</head>
<body>
    <div class="card">
        <div class="header">
            <img src="https://atlas-content-cdn.pixelsquid.com/stock-images/symbol-award-green-prize-ribbon-Ka5kLm3-600.jpg" class="logo">
            <h1 class="mainheading"><i>YourEvent</i></h1>
        </div>
        <p class="paragraph">Online Registration</p>
        <div class="form-row">
            <div class="form-group">
                <label for="firstname">First Name</label>
                <input id="firstname" type="text" placeholder="First Name" class="firstnameinput">
            </div>
            <div class="form-group">
                <label for="lastname">Last Name</label>
                <input id="lastname" type="text" placeholder="Last Name" class="lastnameinput">
            </div>
        </div>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input id="email" type="email" placeholder="Email Address" class="emailaddressinput">
        </div>
        <div class="form-group">
            <label for="company">Company Name (if applicable)</label>
            <input id="company" type="text" placeholder="Company" class="companynameinput">
        </div>
        <div class="form-group">
            <label for="address">Physical Address</label>
            <input id="address" type="text" placeholder="Physical Address" class="physicaladdressinput">
        </div>
        <div class="form-group">
            <label>Date of Birth</label>
            <div class="dob">
                <input class="dateinput" type="number" placeholder="Month">
                <input class="dateinput" type="number" placeholder="Day">
                <input class="dateinput" type="number" placeholder="Year">
            </div>
        </div>
    </div>
</body>
</html>
