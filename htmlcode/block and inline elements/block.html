    <style>
        /* Styling for the table */
        .table-t {
            width: 100%;
            border-collapse: collapse; /* Ensures no gaps between borders */
        }

        /* Styling for table headers */
        .table-t th {
            background-color: #f2f2f2;
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd; /* Add borders to the table cells */
        }

        /* Styling for table cells */
        .table-t td {
            padding: 8px;
            text-align: left;
            border: 1px solid #ddd;
        }

        /* Zebra striping for rows */
        .table-t tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        /* Hover effect for rows */
        .table-t tr:hover {
            background-color: #f1f1f1;
        }

        /* Styling for the table header text */
        .table-t th {
            background-color: #4CAF50;
            color: white;
        }

        /* Optional: Add responsive styling */
        @media (max-width: 600px) {
            .table-t {
                font-size: 12px; /* Smaller font on smaller screens */
            }
        }
    </style>
  </head>
